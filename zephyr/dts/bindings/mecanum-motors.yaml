description: mecanum drivetrain — 4 wheel pwm channels + dir gpios, FL FR RL RR order

compatible: "capstone,mecanum-motors"

properties:
  pwms:
    type: phandle-array
    required: true
    description: speed pwm per wheel (FL, FR, RL, RR)
  dir-gpios:
    type: phandle-array
    required: true
    description: direction gpio per wheel (FL, FR, RL, RR)
